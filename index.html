<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facundo Verdugo | Observability & Cloud Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f293d;
      --border-accent: #2d3b55;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --code-font: 'JetBrains Mono', monospace;
      --heading-font: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--code-font);
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header Nav Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: -0.5px;
    }

    nav {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--accent-cyan);
    }

    /* Hero Section */
    .hero {
      margin-bottom: 4rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      padding: 0.35rem 0.8rem;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    h1 {
      font-family: var(--heading-font);
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
      max-width: 750px;
      margin-bottom: 2rem;
    }

    /* Section Styles */
    section {
      margin-bottom: 4rem;
    }

    .section-title {
      font-family: var(--heading-font);
      font-size: 1.5rem;
      color: var(--text-main);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title span {
      color: var(--accent-green);
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 6px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    .card h3 {
      font-family: var(--heading-font);
      color: var(--accent-cyan);
      font-size: 1.15rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      list-style: none;
    }

    .tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
    }

    .tag-highlight {
      border-color: rgba(6, 182, 212, 0.4);
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.1);
    }

    /* Stat Cards */
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1.25rem;
      border-radius: 6px;
      text-align: left;
    }

    .stat-number {
      font-family: var(--heading-font);
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-amber);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .repo-link {
      display: inline-block;
      color: var(--accent-green);
      text-decoration: none;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      font-weight: 600;
    }

    .repo-link:hover {
      text-decoration: underline;
    }

    /* Estilos Estructurados de la Sección de Contacto */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .contact-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      border-radius: 6px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: border-color 0.2s, background 0.2s;
    }

    .contact-box:hover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.05);
    }

    .contact-title {
      font-size: 0.75rem;
      color: var(--accent-green);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .contact-value {
      font-size: 0.95rem;
      color: var(--text-main);
      word-break: break-all;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer a {
      color: var(--text-main);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent-cyan);
    }

    @media (max-width: 600px) {
      header, footer {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</
